name: 영상 업데이트 + 사이트 배포

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 한국시간 오전 7시 (UTC 22시) - 모든 수집 + 글로벌 콘텐츠 수집
    - cron: "0 9 * * *"    # 매일 한국시간 오후 6시 - 글로벌 콘텐츠 수집(오래 걸림)은 건너뜀
  workflow_dispatch:        # Actions 탭에서 수동 실행도 가능 (모든 수집 실행)
    inputs:
      license_limit:
        description: "이번 실행에서 라이선스를 확인할 영상 수 (처음 채울 때 늘려서 실행, 기본 400)"
        required: false
        default: "400"
  push:
    branches: [main]
    paths: ["web/index.html", "web/reference.js", "web/benchmark.js", "web/taiwan_exp.js", "web/alerts.js", "alerts/**", "web/videos.js", "web/global_topics_jp.js", "web/topic_candidates.js", "web/experience_assignments.js", "web/scorer.js", "web/scores.js", "web/auto_scores.js", "web/video_licenses.js", "data/video_licenses.json", ".github/workflows/update.yml"]   # 화면만 고쳤을 때는 수집 없이 바로 배포

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN != '' }}   # 토큰 값이 아니라 '있는지 여부'만 담는다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 새 영상 검색 (텔레그램 Secrets 가 있으면 알림도 발송)
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python build_site.py --notify

      - name: 일본 주제 영상 갱신 - 가족·첫입·이자카야·친절 (실패해도 사이트 배포는 계속)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python japan_topics_watch.py

      - name: 벤치마킹 채널 목록 갱신 (실패해도 사이트 배포는 계속)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python channels_watch.py

      - name: 화제 영상(오래된 영상 포함) 갱신 (실패해도 사이트 배포는 계속)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python viral_watch.py

      - name: 외국인 체험 영상 갱신 (실패해도 사이트 배포는 계속)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python experience_watch.py

      - name: 별도 레퍼런스 채널 영상 전체 갱신 (실패해도 사이트 배포는 계속)
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 30
        run: python reference_watch.py

      - name: 벤치마킹 채널 영상 전체 갱신 - 레퍼런스와 따로 관리 (실패해도 사이트 배포는 계속)
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 30
        run: python reference_watch.py --bm

      - name: 글로벌 콘텐츠 12개 갈래·140꼭지 갱신 - 오래 걸려서 아침 실행과 수동 실행에서만 (실패해도 사이트 배포는 계속)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 22 * * *'
        continue-on-error: true
        timeout-minutes: 40
        run: python global_topics_watch.py

      - name: 대만 체험 영상 수집 - 외국인이 대만을 여행·체험하는 영상 (아침 실행과 수동 실행에서만, 실패해도 사이트 배포는 계속)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 22 * * *'
        continue-on-error: true
        timeout-minutes: 40
        run: python taiwan_watch.py

      - name: 글로벌 콘텐츠 일본 버전 12개 갈래·140꼭지 갱신 - 아침 실행과 수동 실행에서만 (실패해도 사이트 배포는 계속)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 22 * * *'
        continue-on-error: true
        timeout-minutes: 40
        run: python global_topics_watch.py --jp

      # 알림을 보내는 쪽의 비공개 저장소(koreatambang-alert)의 alerts/ 폴더를 읽어 온다. 읽기 전용 토큰을 Secrets 의 ALERTS_TOKEN 에 넣어야 동작하고, 없으면 이 단계는 건너뛴다.
      # 토큰 값은 로그·코드·파일에 절대 쓰지 않는다 (공개 저장소라 누구나 볼 수 있다). 저장소 이름이 다르면 아래 repository 값만 고친다.
      - name: 알림 저장소(비공개) 읽기
        id: alerts_checkout
        if: env.HAS_ALERTS_TOKEN == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: loveme62981787-maker/koreatambang-alert
          token: ${{ secrets.ALERTS_TOKEN }}
          path: alerts_src
          persist-credentials: false
          sparse-checkout: alerts

      - name: 텔레그램 알림 영상 기록(alerts 폴더)을 사이트 데이터로 변환 (네트워크 없음)
        if: steps.alerts_checkout.outcome == 'success'
        run: python alerts_to_js.py --dir alerts_src/alerts

      # 모든 수집·가져오기가 끝난 뒤에 돈다 (사이트가 쓰는 모든 영상 ID 대상). 한 번에 --limit 개만 확인하고 새 영상을 먼저, 그다음 오래된 확인 순으로 돌아가며 확인한다.
      # 실패해도 기존 기록은 지워지지 않고 사이트 배포도 막지 않는다. 수동 실행에서는 license_limit 으로 한 번에 더 많이 확인할 수 있다 (처음 채우기용)
      - name: 영상 라이선스 상태 확인 - CC BY / 무료 사용 표기 / 미확인 (실패해도 사이트 배포는 계속)
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 30
        env:
          LICENSE_LIMIT: ${{ github.event.inputs.license_limit || '400' }}
        run: python license_watch.py --limit "$LICENSE_LIMIT" --max-seconds 1500

      - name: 라이선스 화면 파일 다시 만들기 (네트워크 없음, 위 단계가 실패·건너뛰어도 기존 기록으로 생성)
        continue-on-error: true
        run: python license_watch.py --export-only

      - name: 데이터 저장 (다음 실행 때 '새 영상' 구분용)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add site_store.json web/videos.js web/channels.js web/viral.js viral_store.json web/experience.js experience_store.json web/japan_topics.js japan_topics_store.json web/global_topics.js global_topics_store.json web/global_topics_jp.js global_topics_jp_store.json web/reference.js reference_store.json web/benchmark.js benchmark_store.json web/taiwan_exp.js taiwan_exp_store.json web/alerts.js
          for f in data/video_licenses.json web/video_licenses.js; do [ -f "$f" ] && git add "$f" || true; done   # 라이선스 파일이 아직 없어도 저장 단계가 실패하지 않게
          git diff --cached --quiet || git commit -m "영상 데이터 업데이트"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
