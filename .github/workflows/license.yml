name: 영상 라이선스 상태 확인 (4시간마다)

# 영상 라이선스(CC BY / 무료 사용 표기) 확인만 따로 돈다. 매일 도는 전체 수집(update.yml)은 건드리지 않는다.
# - 사이트가 쓰는 모든 영상 ID(알림 가져오기로 들어온 새 영상 포함)를 매번 현재 저장소 기준으로 다시 모은다. 새 영상 절반 + 가장 오래된 영상 절반을 먼저 확인하고, 그다음 재확인 순으로 돈다.
# - 결정적인 메타데이터 파싱뿐이라 API 키나 모델 호출이 필요 없다.
# - 실행은 update.yml 과 같은 concurrency 그룹(update)이라 서로 겹치지 않고, 같은 순서로 대기한다. 일정/수동 실행만 있고 push 트리거는 없으며,
#   GITHUB_TOKEN 으로 한 push 는 다른 워크플로를 다시 깨우지 않아 루프가 생기지 않는다.
# - 어떤 단계가 실패해도 기존 기록은 지워지지 않고, 바뀐 것이 있을 때만 저장·배포한다.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      license_limit:
        description: "이번 실행에서 확인할 영상 수 (기본 200)"
        required: false
        default: "200"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 최신 상태 받기 (다른 실행이 먼저 저장한 데이터 반영)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase

      - name: CC BY 새로 찾기 (나라마다 검색 1개·후보 5개, 차단 보이면 즉시 중단 / 실패해도 계속)
        continue-on-error: true
        timeout-minutes: 5
        run: python cc_discover.py --per-country 1 --max-candidates 5 --workers 2

      - name: 영상 라이선스 확인 (최대 10분, 실패해도 계속)
        continue-on-error: true
        timeout-minutes: 10
        env:
          LICENSE_LIMIT: ${{ github.event.inputs.license_limit || '200' }}
        run: python license_watch.py --limit "$LICENSE_LIMIT" --workers 4 --max-seconds 480

      - name: 화면 파일 다시 만들기 (네트워크 없음)
        continue-on-error: true
        run: python license_watch.py --export-only

      - name: 바뀐 것이 있으면 저장
        id: save
        run: |
          for f in data/video_licenses.json web/video_licenses.js data/cc_candidates.json web/cc_videos.js; do [ -f "$f" ] && git add "$f" || true; done
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "영상 라이선스 상태 업데이트"
            if git pull --rebase && git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              git rebase --abort 2>/dev/null || true   # 충돌하면 이번 결과는 버리고 다음 실행에서 다시 한다 (기존 기록은 그대로)
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/configure-pages@v5
        if: steps.save.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.save.outputs.changed == 'true'
        with:
          path: web

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
