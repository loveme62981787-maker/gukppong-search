name: 텔레그램 알림 동기화
on:
  schedule:
    - cron: '0 9 * * *'   # 매일 한국시간 오후 6시 (UTC 9시) — 텔레그램 알림이 보통 오후 5시 전후로 와서 그 뒤에 한 번 반영한다 (사용자 지정 2026-10-26)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-alerts.yml']   # 이 파일을 고치면 바로 한 번 동기화한다 (수동 실행 버튼 대신)
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 비공개 알림 기록 읽기
        uses: actions/checkout@v4
        with:
          repository: loveme62981787-maker/koreatambang-alert
          token: ${{ secrets.ALERTS_TOKEN }}
          path: alerts_src
          persist-credentials: false
          sparse-checkout: alerts
      - name: 공개 필드만 변환
        run: python alerts_to_js.py --dir alerts_src/alerts
      - name: 변경된 알림만 저장
        id: save
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add web/alerts.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "텔레그램 새 알림 동기화"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.save.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.save.outputs.changed == 'true'
        with:
          path: web
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
