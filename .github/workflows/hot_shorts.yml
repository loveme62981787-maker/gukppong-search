name: 터진 쇼츠 수집 + 사이트 배포

# 여행·체험·해외반응 쇼츠 채널과 터진 쇼츠(한국·일본·대만)를 따로 갱신한다. 기존 전체 갱신(update.yml)과 파일이 겹치지 않는다:
#   저장: hot_shorts_store.json, web/hot_shorts.js (이 워크플로만 쓴다). 기존 갱신이 이 파일들을 덮어쓰지 않는다.
# concurrency 그룹을 update.yml 과 같은 'update' 로 써서 두 작업이 동시에 저장·배포하지 않는다.
on:
  schedule:
    - cron: "20 */6 * * *"   # 6시간마다 (UTC 00:20/06:20/12:20/18:20 = 한국시간 09:20/15:20/21:20/03:20). 새 영상 조회수·Shorts 확인 갱신
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 공식 API(키는 Secrets 의 YOUTUBE_API_KEY, 로그에 출력하지 않는다) + 공개 /shorts 탭. 클라우드에서 탭이 막히면 이전 확인 결과를 보존하고 새 영상은 보류로 둔다.
      # 실패해도 기존 저장분은 그대로 남고, 아래 단계는 기존 파일로 화면 파일을 다시 만든다.
      # 저장은 임시 파일 교체(atomic)이고, 저장분이 잘못된 JSON 이면 덮어쓰지 않고 오류로 끝난다. 오류 로그는 Actions 로그에 남는다(키는 출력하지 않는다).
      # 자동 발굴(--discover)은 여기서 돌리지 않는다: 후보는 사람이 실제 영상 제목을 확인해 시드에 올리기 전에는 공개되지 않는다.
      - name: 터진 쇼츠 수집 (실패해도 기존 데이터 유지, 사이트 배포는 계속)
        continue-on-error: true
        timeout-minutes: 20
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python hot_shorts_watch.py

      - name: 화면 파일 다시 만들기 (네트워크 없음)
        continue-on-error: true
        run: python hot_shorts_watch.py --export-only

      - name: 데이터 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add hot_shorts_store.json web/hot_shorts.js
          git diff --cached --quiet || git commit -m "터진 쇼츠 데이터 업데이트"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
