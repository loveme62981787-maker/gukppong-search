# 매일 "외국인 한국/일본 방문 영상 찾기" 설정 (메모장으로 수정하세요)
[settings]
# 길이로 판별하는 쇼츠 최대 길이(초, 이 값 이하)
short_max_sec = 180
# 롱폼 최소 길이(초, 이 값 이상이며 쇼츠가 아닌 영상)
longform_min_sec = 181
# 길이 미확인 영상: keep = 유지(기본), drop = 제외
unknown_length = keep
# 구독자 기준: 이 숫자 미만이면 '소규모', 사이면 '중간', 이상이면 '대형(1만+)'
subs_low = 1000
subs_high = 10000
# 조회수 '높음' 기준 (이 숫자 이상이면 높음)
high_views = 3000
# 구독자 대비 비율 목록: 조회수 / 구독자 가 이 값 이상이고, 조회수가 아래 값 이상인 영상
ratio_min = 3
ratio_min_views = 500
# 그룹마다 보낼 영상 수
per_group = 5
# 맨 위에 따로 보낼 '가장 최근 올라온 영상' 수
latest_top = 10
# 한국편 맨 앞에 보낼 '서울·부산 말고 다른 도시 여행' 영상 수 (기간 제한 없음, 매일 새 영상)
other_cities_count = 15
# '구독자 1천 미만 + 조회수 낮음' 그룹에서 보낼 영상 수 (다른 그룹은 per_group)
per_group_small_low = 15
# 이미 알림으로 보낸 영상을 다음 날 또 보낼지: no = 또 보내도 됨(기본), yes = 한 번 보낸 영상은 다시 안 보냄
# (어느 쪽이든 텔레그램 봇에 링크를 보낸 영상은 항상 제외됩니다)
skip_already_sent = no
# 알림에서 뺄 영상 링크 (쉼표나 띄어쓰기로 구분, 링크 그대로 붙여넣기 가능)
exclude_videos = https://youtu.be/QA3_UafcKes
# 알림에서 통째로 제외할 내 채널 (채널 이름이 똑같으면 제외, 쉼표로 구분)
exclude_channel_names = 코리아탐방록, 코리아관찰기
# 채널 링크로도 제외 가능 (선택, 쉼표로 구분). 예: https://www.youtube.com/@핸들
exclude_channels =
# 최근 며칠 안에 올라온 영상만 볼지
window_days = 7
