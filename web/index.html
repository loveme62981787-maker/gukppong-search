<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>국뽕 영상 서칭</title>
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#14121f;--mute:#6b6880;--line:#e6e3f2;--acc:#5b3df5;--new:#ef4444;--ok:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#0f0e17;--card:#1a1826;--ink:#f1effa;--mute:#9a96b3;--line:#2b2840;--acc:#8b74ff;--ok:#4ade80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Pretendard","Malgun Gothic",system-ui,sans-serif}
header{padding:28px 16px 8px;max-width:1200px;margin:auto}
h1{margin:0 0 4px;font-size:26px}.sub{color:var(--mute);font-size:13px}
.bar{max-width:1200px;margin:10px auto;padding:0 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:12px;color:var(--mute);width:100%;margin-bottom:-2px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}.chip small{opacity:.7;margin-left:4px}
input,select,textarea{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:10px;font:inherit;font-size:13px}
input{flex:1;min-width:140px}
.grid{max-width:1200px;margin:auto;padding:8px 16px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.card.done{opacity:.55}.card.done .th img{filter:grayscale(1)}
.th{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer}.th img,.th iframe{width:100%;height:100%;object-fit:cover;border:0;display:block}
.play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:34px;text-shadow:0 2px 8px #0008;opacity:.85}
.new{position:absolute;top:8px;left:8px;background:var(--new);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;z-index:1}
.body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.t{font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink);text-decoration:none}
.m{color:var(--mute);font-size:12px}.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mute)}.hot{background:#fff1d6;color:#a45a00}
.fav{position:absolute;top:6px;right:8px;background:#0006;border:0;color:#fff;border-radius:99px;width:30px;height:30px;cursor:pointer;font-size:16px;z-index:1}
.fav.on{color:#ffd23f}
.act{display:flex;gap:6px;margin-top:auto}
.btn{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 0;font:inherit;font-size:12px;cursor:pointer}
.btn.on{border-color:var(--ok);color:var(--ok);font-weight:700}.btn.memo.on{border-color:var(--acc);color:var(--acc)}
textarea{width:100%;min-height:64px;resize:vertical;font-size:13px}
[hidden]{display:none!important}
.ch{padding:14px;gap:8px}.ch h3{margin:0;font-size:16px}.ch h3 a{color:var(--ink);text-decoration:none}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.thumbs a{position:relative;aspect-ratio:16/9;display:block;background:#000;border-radius:6px;overflow:hidden}
.thumbs img{width:100%;height:100%;object-fit:cover}.thumbs span{position:absolute;right:2px;bottom:2px;font-size:9px;background:#000a;color:#fff;padding:0 4px;border-radius:4px}
.k-long{background:#e0ecff;color:#1d4ed8}.k-short{background:#ffe4ec;color:#be123c}.k-both{background:#e7f8e8;color:#15803d}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 0}
.tools{max-width:1200px;margin:auto;padding:0 16px 40px;color:var(--mute);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<header><h1>🇰🇷🇯🇵 국뽕 영상 서칭</h1><div class="sub" id="upd"></div></header>
<div class="bar"><button class="chip on" id="mv">🎬 영상</button><button class="chip" id="mc">📺 채널 벤치마킹</button></div>
<div id="chview" hidden>
  <div class="bar"><span class="lbl">영상 형태</span><span id="ctype" style="display:contents"></span></div>
  <div class="bar">
    <input id="cq" placeholder="채널명·메모 검색">
    <select id="csort"><option value="subs">구독자순</option><option value="avg">평균 조회수순</option><option value="last">최근 업로드순</option><option value="score">컨셉 일치순</option></select>
    <select id="cview"><option value="">전체</option><option value="seed">내가 알려준 채널만</option><option value="fav">⭐ 저장만</option><option value="memo">📝 메모 있음</option><option value="hidden">🗑 숨김</option></select>
  </div>
  <div class="sub" style="max-width:1200px;margin:0 auto;padding:0 16px" id="cinfo"></div>
  <div class="grid" id="cgrid"></div>
</div>
<div class="bar vmode"><span class="lbl">업로더 (여러 개 선택 가능)</span><span id="ups" style="display:contents"></span></div>
<div class="bar vmode"><span class="lbl">분류 (여러 개 선택 가능)</span><span id="cats" style="display:contents"></span></div>
<div class="bar vmode"><span class="lbl">보기 (여러 개 선택 가능 · 나라는 둘 중 하나, 나머지는 모두 만족)</span><span id="chips" style="display:contents"></span></div>
<div class="bar vmode">
  <input id="q" placeholder="제목·채널·메모 검색">
  <select id="sort"><option value="new">새로 들어온 순</option><option value="pub">업로드 최신순</option><option value="views">조회수순</option><option value="ratio">구독자 대비 조회수순</option></select></div>
<div class="grid vmode" id="grid"></div>
<div class="tools">
  <span>사용 완료·메모·저장은 이 브라우저에만 저장돼요.</span>
  <button class="chip" id="exp">내보내기</button><button class="chip" id="imp">가져오기</button>
  <input type="file" id="file" accept=".json" hidden>
</div>
<script src="videos.js"></script>
<script src="channels.js" onerror="window.CHANNELS=[]"></script>
<script>
const V = window.VIDEOS || [];
// 분류 기준: build_site.py 가 window.SETTINGS 를 주면 그 값을 쓰고, 없으면 discover.ini 기본값을 쓴다
const S = Object.assign({subs_low:1000, subs_high:10000, high_views:3000, ratio_min:3, ratio_min_views:500}, window.SETTINGS || {});
const fmt = n => n == null ? "?" : n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"K" : n;
const ls = { get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}} };
let favs = new Set(ls.get("favs", [])), done = new Set(ls.get("done", [])), memos = ls.get("memos", {}), hidden = new Set(ls.get("hidden", []));
const seenAt = ls.get("lastVisit", "");

const ratio = v => v.views / Math.max(v.subs || 1, 1);
const isHot = v => v.views >= S.ratio_min_views && ratio(v) >= S.ratio_min;
// 6개 분류: 구독자 규모 × 조회수 (5개) + 구독자 대비 조회수 높음 (겹쳐서 들어갈 수 있음)
const ko = n => n >= 1e4 && n % 1e4 === 0 ? n / 1e4 + "만" : n >= 1e3 && n % 1e3 === 0 ? n / 1e3 + "천" : fmt(n);
const CATS = [
  ["s_lo", `구독자 ${ko(S.subs_low)} 미만 · 조회수 낮음`, v => v.subs < S.subs_low && v.views < S.high_views],
  ["s_hi", `구독자 ${ko(S.subs_low)} 미만 · 조회수 높음`, v => v.subs < S.subs_low && v.views >= S.high_views],
  ["m_lo", `${ko(S.subs_low)}~${ko(S.subs_high)} · 조회수 낮음`, v => v.subs >= S.subs_low && v.subs < S.subs_high && v.views < S.high_views],
  ["m_hi", `${ko(S.subs_low)}~${ko(S.subs_high)} · 조회수 높음`, v => v.subs >= S.subs_low && v.subs < S.subs_high && v.views >= S.high_views],
  ["l", `구독자 ${ko(S.subs_high)} 이상`, v => v.subs >= S.subs_high],
  ["hot", "📈 구독자 대비 조회수 높음", isHot],
];
const withSubs = v => v.subs != null;
// 업로더 구분: 레퍼런스 = 한국어로 운영하는 국내 국뽕 채널 (한글 채널명/제목이거나, 벤치마킹 채널 목록에 있는 채널), 그 외 = 외국인(해외) 업로드
const REF_IDS = new Set((window.CHANNELS || []).map(c => c.id));
const hangulRatio = s => { const t = s.replace(/[\s\d\W_]/g, ""); return t ? (t.match(/[가-힣]/g) || []).length / t.length : 0; };
V.forEach(v => { v._up = REF_IDS.has(v.channel_id) || /[가-힣]/.test(v.channel) || hangulRatio(v.title) >= 0.3 ? "ref" : "foreign"; });

// 여러 개 동시 선택: 같은 줄 안에서는 하나라도 맞으면(OR), 줄이 다르면 모두 맞아야(AND) 보여준다. '전체'를 누르면 그 줄의 선택이 풀린다.
function mkMulti(parent, items, sel, total, onChange) {
  const mk = (k, label, count) => { const b = document.createElement("button"); b.className = "chip"; b.dataset.k = k;
    b.innerHTML = label + (count == null ? "" : `<small>${count}</small>`); parent.append(b); return b; };
  const all = mk("all", "전체", total), btns = items.map(([k, l, n]) => mk(k, l, n));
  const sync = () => { all.classList.toggle("on", sel.size === 0); btns.forEach(b => b.classList.toggle("on", sel.has(b.dataset.k))); };
  all.onclick = () => { sel.clear(); sync(); onChange(); };
  btns.forEach(b => b.onclick = () => { sel.has(b.dataset.k) ? sel.delete(b.dataset.k) : sel.add(b.dataset.k); sync(); onChange(); });
  sync();
}
const catSel = new Set(), viewSel = new Set(), upSel = new Set();
const nHidden = () => [...hidden].filter(x => !x.startsWith("ch:")).length;
mkMulti(document.getElementById("ups"), [["foreign", "🌏 외국인 업로드", V.filter(v => v._up === "foreign").length], ["ref", "🧭 레퍼런스 (국내 국뽕 채널)", V.filter(v => v._up === "ref").length]], upSel, V.length, () => render());
mkMulti(document.getElementById("cats"), CATS.map(([k, l, fn]) => [k, l, V.filter(v => withSubs(v) && fn(v)).length]), catSel, V.length, () => render());
mkMulti(document.getElementById("chips"), [["한국", "🇰🇷 한국"], ["일본", "🇯🇵 일본"], ["other", "🏝 서울·부산 외"], ["fav", "⭐ 저장"], ["memo", "📝 메모 있음"], ["done", "✅ 사용 완료", done.size], ["hidden", "🗑 숨김", nHidden()]], viewSel, null, () => render());
document.getElementById("upd").textContent = "마지막 갱신 " + (window.UPDATED || "-") + " · 영상 " + V.length + "개";
const isNew = v => v.first_seen > (seenAt || "9999") || v.first_seen === (window.UPDATED || "").slice(0, 10);
const saveAll = () => { ls.set("favs", [...favs]); ls.set("done", [...done]); ls.set("memos", memos); ls.set("hidden", [...hidden]); };

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase(), sort = document.getElementById("sort").value;
  const catFns = CATS.filter(c => catSel.has(c[0])).map(c => c[2]);
  const ctry = ["한국", "일본"].filter(k => viewSel.has(k));
  const hc = document.querySelector('#chips [data-k="hidden"] small'); if (hc) hc.textContent = nHidden();
  const dc = document.querySelector('#chips [data-k="done"] small'); if (dc) dc.textContent = done.size;
  const sh = viewSel.has("hidden"), sd = viewSel.has("done");
  // 숨김·사용 완료 영상은 기본 목록에서 빠지고, 각각의 보기에서만 나온다 (같은 채널의 다른 영상은 그대로)
  let a = V.filter(v => ((!sh && !sd) ? !hidden.has(v.id) && !done.has(v.id) : (sh && hidden.has(v.id)) || (sd && done.has(v.id)))
    && (!upSel.size || upSel.has(v._up))
    && (!catFns.length || (withSubs(v) && catFns.some(fn => fn(v))))
    && (!ctry.length || ctry.includes(v.country))
    && (!viewSel.has("other") || v.section === "other") && (!viewSel.has("fav") || favs.has(v.id)) && (!viewSel.has("memo") || memos[v.id])
    && (!q || (v.title + " " + v.channel + " " + (memos[v.id] || "")).toLowerCase().includes(q)));
  a.sort((x, y) => sort === "views" ? y.views - x.views : sort === "ratio" ? ratio(y) - ratio(x) : sort === "pub" ? y.published.localeCompare(x.published) : (y.first_seen + y.published).localeCompare(x.first_seen + x.published));
  const g = document.getElementById("grid"); g.innerHTML = "";
  if (!a.length) g.innerHTML = '<div class="empty">조건에 맞는 영상이 없어요</div>';
  a.forEach(v => {
    const c = document.createElement("div"); c.className = "card" + (done.has(v.id) ? " done" : "");
    c.innerHTML = (isNew(v) ? '<span class="new">NEW</span>' : "") +
      `<button class="fav ${favs.has(v.id) ? "on" : ""}" title="저장">${favs.has(v.id) ? "★" : "☆"}</button>` +
      `<div class="th"><img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg"><div class="play">▶</div></div>` +
      `<div class="body"><a class="t" target="_blank" rel="noopener" href="https://youtu.be/${v.id}"></a><div class="m"></div>` +
      `<div class="tags"><span class="tag">${v.country === "한국" ? "🇰🇷" : "🇯🇵"} ${v.country}${v.section === "other" ? " · 지방" : ""}</span><span class="tag">👥 ${fmt(v.subs)}</span><span class="tag">👁 ${fmt(v.views)}</span>${isHot(v) ? '<span class="tag hot">📈 급상승</span>' : ""}</div>` +
      `<div class="act"><button class="btn dn ${done.has(v.id) ? "on" : ""}">${done.has(v.id) ? "✅ 사용 완료" : "☐ 사용 완료"}</button><button class="btn memo ${memos[v.id] ? "on" : ""}">📝 메모</button><button class="btn hd" title="이 영상만 안 보이게 (같은 채널의 다른 영상은 계속 나와요)">${hidden.has(v.id) ? "↩ 복구" : "🗑 숨김"}</button></div>` +
      `<textarea hidden placeholder="메모 (어디에 쓸지, 번역 메모 등)"></textarea></div>`;
    c.querySelector(".t").textContent = v.title;
    c.querySelector(".m").textContent = v.channel + " · " + v.published;
    c.querySelector(".th").onclick = e => { e.currentTarget.innerHTML = `<iframe src="https://www.youtube.com/embed/${v.id}?autoplay=1" allow="autoplay;encrypted-media" allowfullscreen></iframe>`; e.currentTarget.onclick = null; };
    c.querySelector(".fav").onclick = () => { favs.has(v.id) ? favs.delete(v.id) : favs.add(v.id); saveAll(); render(); };
    c.querySelector(".dn").onclick = () => { done.has(v.id) ? done.delete(v.id) : done.add(v.id); saveAll(); render(); };
    c.querySelector(".hd").onclick = () => { hidden.has(v.id) ? hidden.delete(v.id) : hidden.add(v.id); saveAll(); render(); };
    const ta = c.querySelector("textarea"), mb = c.querySelector(".memo");
    ta.value = memos[v.id] || "";
    mb.onclick = () => { ta.hidden = !ta.hidden; if (!ta.hidden) ta.focus(); };
    ta.oninput = () => { ta.value.trim() ? memos[v.id] = ta.value : delete memos[v.id]; mb.classList.toggle("on", !!memos[v.id]); saveAll(); };
    g.append(c);
  });
}
// ---- 채널 벤치마킹 ----
const C = window.CHANNELS || [];
const ctSel = new Set();
const KIND = {long: "롱폼 위주", short: "숏폼 위주", both: "롱폼+숏폼"};
mkMulti(document.getElementById("ctype"), [["long", "🎞 롱폼 위주"], ["short", "📱 숏폼 위주"], ["both", "🔀 둘 다"]].map(([k, l]) => [k, l, C.filter(c => c.type === k).length]), ctSel, C.length, () => renderCh());
function renderCh() {
  const q = document.getElementById("cq").value.trim().toLowerCase(), sort = document.getElementById("csort").value, vw = document.getElementById("cview").value;
  const key = c => "ch:" + c.id;
  let a = C.filter(c => (vw === "hidden" ? hidden.has(key(c)) : !hidden.has(key(c))) && (!ctSel.size || ctSel.has(c.type))
    && (!vw || vw === "hidden" || (vw === "seed" && c.seed) || (vw === "fav" && favs.has(key(c))) || (vw === "memo" && memos[key(c)]))
    && (!q || (c.name + " " + (memos[key(c)] || "")).toLowerCase().includes(q)));
  a.sort((x, y) => sort === "avg" ? y.avg_views - x.avg_views : sort === "last" ? y.last_upload.localeCompare(x.last_upload) : sort === "score" ? y.score - x.score : (y.subs || 0) - (x.subs || 0));
  document.getElementById("cinfo").textContent = `채널 ${a.length}개 · 갱신 ${window.CH_UPDATED || "-"} · 평균 조회수는 최근 영상 15개 기준`;
  const g = document.getElementById("cgrid"); g.innerHTML = "";
  if (!a.length) g.innerHTML = '<div class="empty">조건에 맞는 채널이 없어요</div>';
  a.forEach(c => {
    const el = document.createElement("div"); el.className = "card ch";
    el.innerHTML = `<button class="fav ${favs.has(key(c)) ? "on" : ""}" style="top:10px">${favs.has(key(c)) ? "★" : "☆"}</button>` +
      `<h3><a target="_blank" rel="noopener" href="https://www.youtube.com/channel/${c.id}"></a></h3>` +
      `<div class="tags"><span class="tag k-${c.type}">${KIND[c.type]}</span><span class="tag">👥 ${fmt(c.subs)}</span><span class="tag">👁 평균 ${fmt(c.avg_views)}</span>${c.seed ? '<span class="tag">내가 알려준 채널</span>' : ""}</div>` +
      `<div class="m">최근 15개 중 롱폼 ${c.long_n} · 숏폼 ${c.short_n} · 마지막 업로드 ${c.last_upload} · 컨셉 일치 ${Math.round(c.score * 100)}%</div>` +
      `<div class="thumbs">${c.latest.map(v => `<a target="_blank" rel="noopener" title="" href="https://youtu.be/${v.id}"><img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg"><span>${v.short ? "쇼츠" : "롱"} · ${fmt(v.views)}</span></a>`).join("")}</div>` +
      `<div class="act"><button class="btn memo ${memos[key(c)] ? "on" : ""}">📝 메모</button><button class="btn hd">${hidden.has(key(c)) ? "↩ 복구" : "🗑 숨김"}</button></div><textarea hidden placeholder="이 채널에서 배울 점, 벤치마킹 메모"></textarea>`;
    el.querySelector("h3 a").textContent = c.name;
    el.querySelectorAll(".thumbs a").forEach((a2, i) => a2.title = c.latest[i].title);
    el.querySelector(".fav").onclick = () => { favs.has(key(c)) ? favs.delete(key(c)) : favs.add(key(c)); saveAll(); renderCh(); };
    el.querySelector(".hd").onclick = () => { hidden.has(key(c)) ? hidden.delete(key(c)) : hidden.add(key(c)); saveAll(); renderCh(); };
    const ta = el.querySelector("textarea"), mb = el.querySelector(".memo"); ta.value = memos[key(c)] || "";
    mb.onclick = () => { ta.hidden = !ta.hidden; if (!ta.hidden) ta.focus(); };
    ta.oninput = () => { ta.value.trim() ? memos[key(c)] = ta.value : delete memos[key(c)]; mb.classList.toggle("on", !!memos[key(c)]); saveAll(); };
    g.append(el);
  });
}
["cq", "csort", "cview"].forEach(i => document.getElementById(i).addEventListener("input", renderCh));
function setMode(ch) {
  document.getElementById("mv").classList.toggle("on", !ch); document.getElementById("mc").classList.toggle("on", ch);
  document.querySelectorAll(".vmode").forEach(e => e.hidden = ch); document.getElementById("chview").hidden = !ch;
  if (ch) renderCh();
}
document.getElementById("mv").onclick = () => setMode(false); document.getElementById("mc").onclick = () => setMode(true);
["q", "sort"].forEach(i => document.getElementById(i).addEventListener("input", render));
document.getElementById("exp").onclick = () => {
  const blob = new Blob([JSON.stringify({favs: [...favs], done: [...done], hidden: [...hidden], memos}, null, 1)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "gukppong-backup.json"; a.click();
};
document.getElementById("imp").onclick = () => document.getElementById("file").click();
document.getElementById("file").onchange = async e => {
  try {
    const d = JSON.parse(await e.target.files[0].text());
    favs = new Set([...favs, ...(d.favs || [])]); done = new Set([...done, ...(d.done || [])]); hidden = new Set([...hidden, ...(d.hidden || [])]); memos = Object.assign({}, d.memos || {}, memos);
    saveAll(); render();
  } catch { alert("가져올 수 없는 파일이에요."); }
};
render(); ls.set("lastVisit", new Date().toISOString().slice(0, 10));
